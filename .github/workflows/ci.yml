# Pre-merge quality gate. Separate jobs keep branch-protection checks
# independently visible and rerunnable.
#
# Typecheck runs `bunx vite build` first because the TSS plugin
# generates src/routeTree.gen.ts during build; tsc needs that file to
# type-check route files correctly.

name: CI

on:
  pull_request:
    branches:
      - main
  # Intentionally no `push:` trigger. Checks fire on PRs only — branch
  # protection gates the merge. deploy.yml's push trigger handles
  # auto-deploy separately.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0, reads packageManager

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Worker types
        run: bun run cf-typegen

      - name: Build + typecheck
        # vite build triggers the tanstackStart() plugin, which writes
        # src/routeTree.gen.ts; the package build script then runs tsc.
        run: bun run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0, reads packageManager

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint
