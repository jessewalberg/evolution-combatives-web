name: E2E

on:
  pull_request:
    branches: [main, master, development]
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: 'Update visual baselines (Linux only - commit artifact afterward)'
        type: boolean
        default: false

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    # Fork PRs cannot access repository secrets - skip rather than fail noisily.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 60

    env:
      CI: true
      # NODE_ENV must NOT be production at job scope: pnpm install would skip
      # devDependencies (including @playwright/test). Production mode for the
      # app server is set in playwright.config.ts webServer.env instead.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_BEGINNER_PRICE_ID: ${{ secrets.STRIPE_BEGINNER_PRICE_ID }}
      STRIPE_INTERMEDIATE_PRICE_ID: ${{ secrets.STRIPE_INTERMEDIATE_PRICE_ID }}
      STRIPE_ADVANCED_PRICE_ID: ${{ secrets.STRIPE_ADVANCED_PRICE_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_CUSTOMER_SUBDOMAIN: ${{ secrets.CLOUDFLARE_CUSTOMER_SUBDOMAIN }}
      CLOUDFLARE_STREAM_SIGNING_KEY: ${{ secrets.CLOUDFLARE_STREAM_SIGNING_KEY }}
      CLOUDFLARE_STREAM_SIGNING_KEY_ID: ${{ secrets.CLOUDFLARE_STREAM_SIGNING_KEY_ID }}
      CLOUDFLARE_STREAM_WEBHOOK_SECRET: ${{ secrets.CLOUDFLARE_STREAM_WEBHOOK_SECRET }}
      CLOUDFLARE_WEBHOOK_SECRET: ${{ secrets.CLOUDFLARE_WEBHOOK_SECRET }}
      NEXT_PUBLIC_MOBILE_APP_SCHEME: ${{ secrets.NEXT_PUBLIC_MOBILE_APP_SCHEME }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_ADMIN_URL: ${{ secrets.NEXT_PUBLIC_ADMIN_URL }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium webkit --with-deps

      - name: Run Playwright E2E
        run: pnpm test:e2e

      - name: Run Playwright visual regression
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_visual_baselines != true }}
        run: pnpm test:e2e:visual

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  visual-baselines:
    name: Update visual baselines
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines == true
    timeout-minutes: 60

    env:
      CI: true
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_BEGINNER_PRICE_ID: ${{ secrets.STRIPE_BEGINNER_PRICE_ID }}
      STRIPE_INTERMEDIATE_PRICE_ID: ${{ secrets.STRIPE_INTERMEDIATE_PRICE_ID }}
      STRIPE_ADVANCED_PRICE_ID: ${{ secrets.STRIPE_ADVANCED_PRICE_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_CUSTOMER_SUBDOMAIN: ${{ secrets.CLOUDFLARE_CUSTOMER_SUBDOMAIN }}
      CLOUDFLARE_STREAM_SIGNING_KEY: ${{ secrets.CLOUDFLARE_STREAM_SIGNING_KEY }}
      CLOUDFLARE_STREAM_SIGNING_KEY_ID: ${{ secrets.CLOUDFLARE_STREAM_SIGNING_KEY_ID }}
      CLOUDFLARE_STREAM_WEBHOOK_SECRET: ${{ secrets.CLOUDFLARE_STREAM_WEBHOOK_SECRET }}
      CLOUDFLARE_WEBHOOK_SECRET: ${{ secrets.CLOUDFLARE_WEBHOOK_SECRET }}
      NEXT_PUBLIC_MOBILE_APP_SCHEME: ${{ secrets.NEXT_PUBLIC_MOBILE_APP_SCHEME }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_ADMIN_URL: ${{ secrets.NEXT_PUBLIC_ADMIN_URL }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Update visual snapshots
        run: pnpm test:e2e:visual:update

      - name: Upload visual baseline PNGs
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: e2e/visual/**/*-snapshots/
          retention-days: 14

      - name: Upload Playwright report (baseline job)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
